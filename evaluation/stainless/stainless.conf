# Picked up by the Stainless plugin (searched upward from the working
# directory). The plugin itself only parses the verify and ghost-elim
# -P:stainless: options; everything else is configured here.
#
# timeout bounds each verification condition: Z3 occasionally diverges on
# some VCs (observed on sumnat: usually ~10 s, rarely hangs for hours), which
# would otherwise wedge a benchmark run indefinitely. Healthy VCs solve well
# under this bound, so measured times are unaffected.
#
# vc-cache disables the persistent VC cache (.stainless-cache/): with it on,
# every iteration after the first hits the on-disk cache instead of calling
# the solver, so the benchmarks would not measure verification at all.
#
# check-measures, infer-measures and strict-arithmetic are disabled to align
# the measured work with the other platforms: neither first-class refinement 
# types nor LiquidTyper prove termination or absence of overflow (both use
# wrapping integer semantics).
timeout = 30
vc-cache = false
check-measures = false
infer-measures = false
strict-arithmetic = false
