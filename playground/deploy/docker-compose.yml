# The playground backend and the TLS proxy in front of it, as deployed on
# icvm0175.epfl.ch. The backend is the only thing on that host: nginx-proxy routes the
# whole vhost to it, and it answers POST / with the compiler's output.
name: refinement-types

services:
  letsproxy:
    image: neilpang/letsproxy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    # On `default` to reach Let's Encrypt, on `backend` to reach the playground.
    networks:
      - default
      - backend
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./proxy/certs:/etc/nginx/certs
      - ./proxy/acme:/acmecerts
      - ./proxy/conf.d:/etc/nginx/conf.d
      - ./proxy/vhost.d:/etc/nginx/vhost.d
      - ./proxy/stream.d:/etc/nginx/stream.d
      - ./proxy/dhparam:/etc/nginx/dhparam

  playground:
    build:
      context: ../server
    image: refinement-types-playground
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=icvm0175.epfl.ch
      - VIRTUAL_PORT=8080
      - ENABLE_ACME=true
      - PLAYGROUND_STORE=/store
    # A snippet cannot call macros it defines itself, and inline expansion is depth-capped,
    # so this is not arbitrary code execution. What a snippet can do is make the compiler
    # hang or exhaust memory, and a compiler bug could do worse, so the container is held to
    # the least it needs: `backend` is internal, leaving it no route off the host.
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    # Submitted programs and their output, outliving the container. A bind mount rather
    # than a named volume so the corpus can be read and copied off the host directly. The
    # root filesystem stays read-only; this is the one place the service can write.
    volumes:
      - ./store:/store
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    # Two JVMs now: the server and the compiler worker it spawns.
    pids_limit: 512
    # Nothing restarts an unhealthy container on its own; this is for `docker compose ps`.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  default:
  backend:
    internal: true
