name: Benchmarks dry run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  first-class:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/Library/Caches/Coursier
          key: sbt-first-class-${{ matrix.os }}-${{ hashFiles('**/build.sbt', '**/plugins.sbt', '**/build.properties') }}
          restore-keys: sbt-first-class-${{ matrix.os }}-

      - name: Run first-class benchmarks (dry run)
        working-directory: evaluation
        run: ./run.sh --suite first-class --dry-run

  stainless:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel rather than macos-15: the ScalaZ3 native bindings are
        # x86-64 only; on the ARM64 macos-15 runners inox falls back to
        # Princess, which is not what we benchmark (and OOMs on 7 GB runners).
        os: [ubuntu-24.04, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/Library/Caches/Coursier
          key: sbt-stainless-${{ matrix.os }}-${{ hashFiles('**/build.sbt', '**/plugins.sbt', '**/build.properties') }}
          restore-keys: sbt-stainless-${{ matrix.os }}-

      - name: Build Stainless
        working-directory: evaluation/stainless
        run: ./setup.sh

      - name: Run Stainless benchmarks (dry run)
        working-directory: evaluation
        run: ./run.sh --suite stainless --dry-run

  schmid:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          # Zulu rather than Temurin: the latter has no macOS/ARM64 JDK 8 builds
          distribution: zulu
          java-version: 8

      - name: Record JDK 8 home
        run: echo "JDK8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/Library/Caches/Coursier
          key: sbt-schmid-${{ matrix.os }}-${{ hashFiles('**/build.sbt', '**/plugins.sbt', '**/build.properties') }}
          restore-keys: sbt-schmid-${{ matrix.os }}-

      - name: Install Z3
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y z3
          else
            brew install z3
          fi

      - name: Build refined-dotty
        working-directory: evaluation/schmid
        run: ./setup.sh

      - name: Run Schmid benchmarks (dry run)
        working-directory: evaluation
        run: ./run.sh --suite schmid --dry-run

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build image
        run: docker build -t refinement-bench evaluation

      - name: Run all suites (dry run)
        run: |
          mkdir -p results
          docker run -v "$PWD/results:/work/evaluation/results" refinement-bench --suite all --dry-run

      - name: Check result files
        run: |
          ls -lR results
          test -s results/0/first-class.json
          test -s results/0/stainless.json
          test -s results/0/schmid.json
