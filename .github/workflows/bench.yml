name: Benchmarks dry run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bench:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/Library/Caches/Coursier
          key: sbt-${{ matrix.os }}-${{ hashFiles('**/build.sbt', '**/plugins.sbt', '**/build.properties') }}
          restore-keys: sbt-${{ matrix.os }}-

      - name: Run first-class benchmarks (dry run)
        working-directory: evaluation/first-class
        run: sbt "clean; bench / Jmh / run -wi 0 -i 1 -foe true"

      - name: Build Stainless
        working-directory: evaluation/stainless
        run: ./setup.sh

      - name: Run Stainless benchmarks (dry run)
        working-directory: evaluation/stainless
        run: sbt "clean; bench / Jmh / run -wi 0 -i 1 -foe true"
