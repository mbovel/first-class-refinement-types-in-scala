name: Docker artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Free runner disk space
        # BuildKit keeps the build cache plus the exported image, about twice
        # the image size, which exceeds the stock runner's free disk (the
        # previous run was SIGTERMed while exporting layers). Dropping unused
        # preinstalled toolchains frees ~30 GB.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build image
        run: docker build -t refinement-artifact .

      - name: Run the artifact image (mechanization + all suites, dry run)
        # --network none proves the image is self-contained: nothing may be
        # downloaded at run time.
        run: |
          mkdir -p results
          docker run --network none -v "$PWD/results:/work/evaluation/results" refinement-artifact

      - name: Check result files
        run: |
          ls -lR results
          test -s results/0/first-class.json
          test -s results/0/stainless.json
          test -s results/0/schmid.json
