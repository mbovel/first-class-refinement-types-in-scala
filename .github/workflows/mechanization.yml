name: Mechanization

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    # Stock Rocq image rather than the artifact Dockerfile: building the full
    # artifact image takes ~30 minutes and is covered by the docker job of the
    # benchmarks workflow; this job gives a fast signal on the proofs alone.
    container:
      image: rocq/rocq-prover:9.2
      # The image's default user (rocq, uid 1000) cannot write the
      # runner-owned workspace and temp directories.
      options: --user root
    env:
      OPAMROOT: /home/rocq/.opam
    steps:
      - uses: actions/checkout@v5

      - name: Compile the mechanization
        run: opam exec -- make -C mechanization
