name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize: two overlapping runs would race in the same FTP directory.
concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # Same stock Rocq image as the Mechanization workflow: coqdoc needs the
    # compiled proofs (.glob files), so this rebuilds the mechanization.
    container:
      image: rocq/rocq-prover:9.2
      # The image's default user (rocq, uid 1000) cannot write the
      # runner-owned workspace and temp directories.
      options: --user root
    env:
      OPAMROOT: /home/rocq/.opam
    steps:
      - uses: actions/checkout@v5

      # Only this submodule: a recursive checkout would also clone the large
      # dotty and stainless submodules, which the doc build does not need.
      - name: Check out coqdocjs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init mechanization/coqdocjs

      - name: Copy the paper and the slides
        run: ./make-website.sh

      - name: Generate coqdoc
        run: opam exec -- mechanization/gendoc.sh

      # Handed to the publish job, which runs outside the Rocq container.
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: website

  # The playground editor, built on its own because Node is not in the Rocq image and
  # the editor needs nothing the mechanization produces. Merged into the site by
  # `publish`, which downloads both artifacts into the same tree.
  editor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/editor/package-lock.json

      # --ignore-scripts: tree-sitter-scala's install hook builds native Node bindings
      # that nothing here uses. Only its .wasm and its highlight queries get bundled.
      - name: Build the editor
        working-directory: playground/editor
        run: |
          npm ci --ignore-scripts
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: playground
          path: website/playground

  # The canonical URL advertised in the paper and on the talk's QR code is
  # matt.bovel.net/scala-refinement-types/, served over FTP. A separate job
  # rather than a step of `build`: lftp is not in the Rocq image.
  publish:
    needs: [build, editor]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: website

      - uses: actions/download-artifact@v4
        with:
          name: playground
          path: website/playground

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload to matt.bovel.net
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: /scala-refinement-types
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Set the FTP_HOST repository secret}"
          : "${FTP_USER:?Set the FTP_USER repository secret}"
          : "${FTP_PASS:?Set the FTP_PASS repository secret}"
          # The mirror below deletes whatever it does not upload, so refuse to
          # run against an incomplete build.
          for f in index.html paper.pdf paper-acm.pdf \
                   presentation/index.html \
                   presentation/presentation.pdf mechanization/toc.html \
                   playground/index.html; do
            test -f "website/$f" || { echo "missing website/$f"; exit 1; }
          done
          # Commands on stdin rather than `lftp -c`, which would put the
          # password in the process list.
          lftp <<EOF
          set cmd:fail-exit yes
          open -u "$FTP_USER","$FTP_PASS" ftp://$FTP_HOST
          mirror --reverse --delete --verbose --parallel=4 website/ "$FTP_REMOTE_DIR/"
          bye
          EOF
